version: "3.9"

services:

  # ── Backend — FastAPI + OpenCV + face_recognition ──────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: attendance_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Use a named volume ONLY for the SQLite database file.
      # DO NOT mount the entire /app/backend — that would overwrite the source
      # files (main.py, liveness.py, etc.) with an empty volume on first run.
      - db_data:/app/data
      # Mount known faces so photos can be added/updated without rebuilding.
      - ./known_faces:/app/known_faces
    environment:
      KNOWN_FACES_DIR: /app/known_faces
      PREDICTOR_PATH:  /app/backend/shape_predictor_68_face_landmarks.dat
      DB_PATH:         /app/data/database.db
      PYTHONPATH:      /app
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - attendance_net

  # ── Frontend — Nginx static file server ────────────────────────────────────
  frontend:
    image: nginx:1.25-alpine
    container_name: attendance_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - attendance_net

volumes:
  db_data:
    driver: local

networks:
  attendance_net:
    driver: bridge
